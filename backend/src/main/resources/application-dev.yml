spring:
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:mos}
    username: ${POSTGRES_USER:mos}
    password: ${POSTGRES_PASSWORD:mos_dev}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

mos:
  demo:
    seed:
      enabled: true

management:
  endpoint:
    health:
      show-details: always
