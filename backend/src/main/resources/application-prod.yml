spring:
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:postgres}:${POSTGRES_PORT:5432}/${POSTGRES_DB:mos}
    username: ${POSTGRES_USER:mos}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: ${BACKEND_PORT:8080}
  forward-headers-strategy: framework

mos:
  cors:
    allowed-origins: ${MOS_CORS_ALLOWED_ORIGINS:http://172.23.80.1}
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  qr:
    base-url: ${MOS_QR_BASE_URL:https://mos.local/qr}
  demo:
    seed:
      enabled: ${MOS_DEMO_SEED_ENABLED:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized
  health:
    db:
      enabled: true

logging:
  level:
    root: INFO
    com.mos: INFO
    org.springframework.web: WARN
    org.hibernate: WARN
