services:
  postgres:
    image: postgres:16-alpine
    container_name: mos-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: mos
      POSTGRES_USER: mos
      POSTGRES_PASSWORD: mos_dev
    volumes:
      - mos_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mos -d mos"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  mos_pgdata:
