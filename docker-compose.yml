services:
  postgres:
    image: postgres:16-alpine
    container_name: mos-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mos}
      POSTGRES_USER: ${POSTGRES_USER:-mos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - mos_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mos} -d ${POSTGRES_DB:-mos}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mos-backend
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod,dev}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-mos}
      POSTGRES_USER: ${POSTGRES_USER:-mos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      BACKEND_PORT: ${BACKEND_PORT:-8080}
      MOS_CORS_ALLOWED_ORIGINS: ${MOS_CORS_ALLOWED_ORIGINS:-http://localhost}
      MOS_DEMO_SEED_ENABLED: ${MOS_DEMO_SEED_ENABLED:-true}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ""
    container_name: mos-frontend
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    container_name: mos-nginx
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
    restart: unless-stopped

volumes:
  mos_pgdata:
